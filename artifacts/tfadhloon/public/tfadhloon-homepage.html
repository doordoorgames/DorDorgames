  <body>
    <div id="tfBootOverlay" role="status" aria-live="polite">
      <div class="tf-boot-blob">
        <span class="tf-boot-ar">خل نلعب تفضلون</span>
        <span class="tf-boot-en">Let's Play TFADHLOON</span>
      </div>
    </div>

    <!-- Room-code modal — name is entered directly on the home screen. -->
    <div id="roomCodeOverlay" class="nickname-overlay" aria-hidden="true">
      <div class="nickname-card room-code-card" role="dialog" aria-modal="true" aria-labelledby="roomCodeTitle">
        <button id="roomCodeCloseBtn" class="nickname-close-btn small-button icon shape-3" data-blob-variant="triangle" type="button" aria-label="Close">
          &times;
        </button>
        <h2 id="roomCodeTitle" class="room-code-title">Enter room code</h2>
        <input
          type="text"
          id="joinGameInput"
          class="nickname-blob-input form-control-custom"
          inputmode="numeric"
          pattern="[0-9]{5}"
          maxlength="5"
          autocomplete="one-time-code"
          aria-label="Enter room code"
        />
        <button id="roomCodeSubmitBtn" class="nickname-start-btn small-button" type="button">
          <span id="roomCodeSubmitBtnText">Join</span>
        </button>
      </div>
    </div>

    
    

    <div class="tf-app-shell">
      <header class="tf-topbar" aria-label="Page controls">
        <div class="tf-topbar-start">
          <button id="backBtn" class="back-btn" type="button">
            <i class="bi bi-arrow-left"></i>
            <span id="backBtnText">Back to Home</span>
          </button>
        </div>
        <div class="tf-topbar-center" aria-hidden="true"></div>
        <div class="tf-topbar-end">
          <div id="langSwitcherContainer" class="language-switcher-container">
            <div class="language-blob-group" role="group" aria-label="Language">
              <button type="button" class="language-option language-blob menu-button compact shape-2" data-lang="ar" aria-label="العربية">ع</button>
              <button type="button" class="language-option language-blob menu-button compact shape-1" data-lang="en" aria-label="English">EN</button>
            </div>
          </div>
        </div>
      </header>
      <main class="tf-app-content">
        <div class="container tf-screen-content">
      <section class="tf-home-hero" aria-label="Game setup">
      <div class="header">
        <img src="gallary/name-12.png" class="img-fluid" alt="img" />
      </div>

      <div class="game-container">
        <div class="spy-icon"></div>

        <label id="homeNameLabel" class="home-name-label" for="homeNameInput">Enter your name</label>
        <div class="home-name-field">
          <input
            type="text"
            id="homeNameInput"
            class="form-control form-control-custom"
            placeholder="Enter your name"
            autocomplete="nickname"
            autofocus
          />
        </div>

        <div id="newGameSection" class="text-center">
          <button id="newGameBtn" class="new-game-btn menu-button full-width shape-1"></button>
        </div>

        <div id="homeGuidanceOutline" class="tf-onboarding-outline" aria-hidden="true"></div>

        <div id="joinGameSection" class="text-center button-settings-p">
          <button id="joinGameBtn" class="join-game-btn menu-button full-width shape-2"></button>
        </div>

        <div id="howToPlaySection" class="text-center button-settings-p">
          <button id="howToPlayBtn" class="how-to-play-btn" type="button">▶ How to Play</button>
        </div>

        <div class="character">
          <div class="character-head">
            <div class="character-eye eye-left"></div>
            <div class="character-eye eye-right"></div>
            <div class="character-mouth"></div>
          </div>
          <div class="character-body"></div>
        </div>
      </div>
      </section>

        </div>
      </main>
    </div>

    <div id="tutorialOverlay" class="tutorial-overlay" role="dialog" aria-modal="true" aria-labelledby="tutorialTitle" aria-hidden="true">
      <div class="tutorial-dialog">
        <button id="tutorialCloseBtn" class="tutorial-close" type="button" aria-label="Close how to play">&times;</button>
        <h2 id="tutorialTitle">How to Play</h2>
        <img src="tutorial.png" class="tutorial-inline-image" alt="Game introduction" />
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>

    <button
      id="micBtn"
      class="small-button icon shape-1"
      style="
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 999;
        width: 60px;
        height: 60px;
        font-size: 24px;
      "
    >
      <i id="micIcon" class="bi bi-mic-mute-fill"></i>
    </button>

    <button
      id="speakerBtn"
      class="small-button icon shape-4" data-blob-variant="star"
      style="
        position: fixed;
        bottom: 90px;
        right: 20px;
        z-index: 999;
        width: 60px;
        height: 60px;
        font-size: 24px;
      "
    >
      <i id="speakerIcon" class="bi bi-volume-mute-fill"></i>
    </button>
