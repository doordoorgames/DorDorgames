<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Spy Game - Lobby</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
    <link href="custom/custom.css" rel="stylesheet" type="text/css" />
    <script src="custom/lang.js"></script>
    
  
    <link rel="stylesheet" href="spy-lobby.css" />
    <link rel="stylesheet" href="spy-mobile.css" />
  </head>
  <body>
    

    <!-- Back Button -->
    <button id="backBtn" class="back-btn">
      <i class="bi bi-arrow-left" style="margin-right: 8px"></i>
      <span id="backBtnText">Back</span>
    </button>

    <div class="container">
      <div class="lobby-container">
<div class="spy-icon-large">
  <img src="gallary/Aljasoos.png" class="game-logo">
</div>
        <p class="game-subtitle" id="waitingText">
          Waiting for players to join...
        </p>

        <!-- Redirect Notice -->
        <div id="redirectNotice" class="redirect-notice" style="display: none">
          <i class="bi bi-hourglass-split"></i> Game is starting, redirecting...
        </div>

        <div class="game-code-box">
          <div>Game Code: <strong id="gameCodeDisplay">XXXXX</strong></div>
          <button class="copy-btn" id="copyLinkBtn"><i class="bi bi-link-45deg"></i> Copy Link</button>
          <button class="copy-btn" id="copyCodeBtn"><i class="bi bi-copy"></i> Copy Code</button>
          <button class="copy-btn" id="shareBtn" style="display:none"><i class="bi bi-share"></i> Share</button>
        </div>

        <div class="spy-count-info" id="spyCountInfo">
          <i class="bi bi-person-lines-fill"></i> 4-5 players: 1 spy | 6-8 players: 1-2
          spies | 9-12 players: 2 spies
        </div>

        <h4 id="playersTitle">Players:</h4>
        <div class="players-container" id="playersContainer">
          <!-- Players will be added here -->
        </div>
        <p id="connectionStatus" class="text-center mt-2" role="status"></p>

        <button class="start-btn" id="startGameBtn" disabled>
          <i class="bi bi-play-circle-fill"></i>
          <span id="startGameText">Start Game</span>
        </button>

        <p class="text-center mt-3" id="minPlayersText">
          Minimum 4 players needed to start
        </p>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="spy-core.js"></script>
    
  
    <script src="spy-lobby.js"></script>
  </body>
</html>
