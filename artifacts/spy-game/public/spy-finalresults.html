<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Spy Game - Final Results</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
    
  
    <link rel="stylesheet" href="spy-finalresults.css" />
    <link rel="stylesheet" href="spy-mobile.css" />
  </head>
  <body>
    

    <!-- Back Button -->
    <button id="backBtn" class="back-btn">
      <i class="bi bi-box-arrow-left" style="margin-right: 8px"></i>
      <span id="backBtnText">Exit</span>
    </button>

    <div class="container">
      <div class="results-container">
        <h1 class="results-title">
          <i class="bi bi-incognito"></i> Spy Game - Final Results
        </h1>

        <!-- Results Card -->
        <div class="result-card" id="resultCard">
          <div class="winner-icon" id="winnerIcon">
            <i class="bi bi-trophy-fill"></i>
          </div>
          <h2 class="winner-title" id="winnerTitle">Game Over!</h2>
          <p class="winner-message" id="winnerMessage">Loading results...</p>
        </div>

        <!-- Spy Reveal Section -->
        <div class="spy-reveal" id="spyReveal">
          <h3><i class="bi bi-incognito"></i> The Spy(s) was:</h3>
          <div class="spy-name" id="spyName">Loading...</div>
          <p>Secret Word: <strong id="secretWordDisplay">••••••</strong></p>
        </div>

        <!-- Voting Results -->
        <div class="voting-results">
          <h4><i class="bi bi-bar-chart-line-fill"></i> Voting Results</h4>
          <div id="votingResultsList">
            <!-- Voting results will be listed here -->
          </div>
        </div>

        <!-- Game Details -->
        <div class="details-box">
          <h4 class="mb-3"><i class="bi bi-clipboard-data"></i> Game Summary</h4>
          <div class="detail-item">
            <span>Winner:</span>
            <strong id="winnerDisplay">Calculating...</strong>
          </div>
          <div class="detail-item">
            <span>Total Rounds:</span>
            <strong id="roundsDisplay">1</strong>
          </div>
          <div class="detail-item">
            <span>Total Players:</span>
            <strong id="playersCountDisplay">0</strong>
          </div>
        </div>

        <!-- Players List with Points -->
        <div class="player-list">
          <h4 class="mb-3"><i class="bi bi-people-fill"></i> Final Scores</h4>
          <div id="playersList">
            <!-- Players will be listed here -->
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
          <button class="action-btn secondary" id="lobbyBtn">
            <i class="bi bi-door-open-fill"></i>
            <span id="lobbyBtnText">Back to Lobby</span>
          </button>
          <button class="action-btn" id="newGameBtn">
            <i class="bi bi-arrow-repeat"></i>
            <span id="newGameBtnText">New Game</span>
          </button>
        </div>
        <p id="hostWaitingText" class="text-center mt-3" role="status"></p>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="spy-core.js"></script>
    
  
    <script src="spy-finalresults.js"></script>
  </body>
</html>
