<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Who is the Spy?</title>
<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
rel="stylesheet"
crossorigin="anonymous"
/>
<link
rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
/>
<link href="custom/custom.css" rel="stylesheet" type="text/css" />
<script src="custom/lang.js"></script>
<link rel="stylesheet" href="spy-homepage.css" />
<link rel="stylesheet" href="spy-mobile.css" />
</head>
<body>

<!-- Back Button -->
<button id="backBtn" class="back-btn" type="button">
  <i class="bi bi-arrow-left" style="margin-right: 8px"></i>
  <span id="backBtnText">Back to Home</span>
</button>

<!-- Language Toggle -->
<button id="langToggleBtn" class="lang-toggle-btn">
  <i class="bi bi-translate"></i>
  <span id="langToggleText">English</span>
</button>

<div class="container">

  <!-- Header -->
  <div class="header">
    <h1 class="game-title">Who is the Spy?</h1>
    <p class="game-subtitle" id="gameSubtitle">Find the hidden spy among you!</p>
    <div class="spy-icon-large">
      <img src="gallary/spy-logo-purple-nobg.png" class="game-logo">
    </div>
  </div>

  <!-- Buttons ABOVE instructions -->
  <div class="game-container">
    <div id="inviteGameSection" class="text-center mb-4 d-none">
      <p id="inviteRoomText">Joining room <strong id="inviteCodeDisplay"></strong></p>
      <input type="text" id="inviteNicknameInput" class="form-control form-control-custom" placeholder="Enter your nickname" maxlength="24" autocomplete="nickname" />
      <button id="inviteJoinBtn" class="btn-action join-game-btn mt-2">Join Room</button>
      <p id="inviteStatus" class="mt-2" role="status"></p>
    </div>
    <div id="standardGameSections">
    <div id="newGameSection" class="text-center mb-4">
      <button id="newGameBtn" class="btn-action new-game-btn">
        Create New Game
      </button>
      <input
        type="text"
        id="newGameInput"
        class="form-control form-control-custom d-none"
        placeholder="Enter your name"
      />
    </div>
    <div id="joinGameSection" class="text-center button-settings-p">
      <button id="joinGameBtn" class="btn-action join-game-btn">
        Join Game
      </button>
      <input
        type="text"
        id="joinGameInput"
        class="form-control form-control-custom d-none"
        placeholder="Enter game code"
      />
    </div>
    <div class="text-center mt-3">
      <button id="howToPlayBtn" class="btn-action how-to-play-btn" type="button">
        How to Play
      </button>
    </div>
    <div class="text-center mt-2">
      <button id="clearNameBtn" class="btn-action d-none" style="font-size:0.85rem; padding: 6px 18px;">
        <i class="bi bi-x-circle"></i> <span id="clearNameBtnText">Clear Saved Name</span>
      </button>
    </div>
    </div>
  </div>

  <div id="instructionsOverlay" class="instructions-overlay" role="dialog" aria-modal="true" aria-labelledby="howToPlay" aria-hidden="true">
  <div class="game-instructions">
    <button id="closeInstructionsBtn" class="instructions-close" type="button" aria-label="Close how to play">&times;</button>
    <h4 id="howToPlay"><i class="bi bi-list-check"></i> <span id="howToPlayTitle">How to Play:</span></h4>
    <ul id="instructionsText" class="instructions-list">
      <li>
        <i class="bi bi-person-badge"></i>
        <span>One player is secretly assigned as the Spy.</span>
      </li>
      <li>
        <i class="bi bi-chat-square-text"></i>
        <span>Non-spies get the same secret word.</span>
      </li>
      <li>
        <i class="bi bi-lightbulb"></i>
        <span>Give clues to identify teammates without revealing to the Spy.</span>
      </li>
      <li>
        <i class="bi bi-check2-square"></i>
        <span>Vote to identify the Spy before they guess the word.</span>
      </li>
    </ul>
  </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="spy-core.js"></script>
<script src="spy-homepage.js"></script>
</body>
</html>
