kind = "web"
previewPath = "/"
title = "DoorDoor.games"
version = "1.0.0"
id = "artifacts/doordoor"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20948

[services.development]
run = "pnpm --filter @workspace/doordoor run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/doordoor", "run", "build" ]
publicDir = "artifacts/doordoor/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20948"
BASE_PATH = "/"
